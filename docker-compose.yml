version: '3.8'

services:
  # 1. Next.js Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocare_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:P%40ssw0rd@db:3306/db_autocar
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=autocar-super-secret-key-2026
    depends_on:
      db:
        condition: service_healthy

  # 2. MariaDB 11.8 Database
  db:
    image: mariadb:11.8
    container_name: autocare_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
      MYSQL_DATABASE: db_autocar
      MYSQL_USER: autocare
      MYSQL_PASSWORD: P@ssw0rd
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. phpMyAdmin (Database Management Web GUI)
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: autocare_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mariadb_data:
    name: autocare_mariadb_data
